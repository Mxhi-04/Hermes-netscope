<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="hermesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070a"/>
      <stop offset="50%" stop-color="#0b0d14"/>
      <stop offset="100%" stop-color="#07080d"/>
    </linearGradient>

    <!-- Hermes Solar Flame & Gold Gradient -->
    <linearGradient id="hermesGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="35%" stop-color="#FF6B00"/>
      <stop offset="70%" stop-color="#FFAA00"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>

    <linearGradient id="caduceusGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="50%" stop-color="#FFAA00"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <!-- Cyber Cyan Accent -->
    <linearGradient id="hermesCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>

    <!-- Pulse Beam -->
    <linearGradient id="speedBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFB800" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes wingFlap {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-2.5deg); }
      }
      @keyframes wingFlapRight {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(2.5deg); }
      }
      @keyframes packetSpeed {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes goldPulse {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 122, 0, 0.7)); opacity: 1; }
        50% { filter: drop-shadow(0 0 3px rgba(255, 122, 0, 0.25)); opacity: 0.85; }
      }
      @keyframes beaconBlink {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #FFD700); }
        50% { opacity: 0.2; }
      }
      .anim-wing-l {
        transform-origin: 90px 85px;
        animation: wingFlap 3s ease-in-out infinite;
      }
      .anim-wing-r {
        transform-origin: 90px 85px;
        animation: wingFlapRight 3s ease-in-out infinite;
      }
      .anim-packet-fast {
        stroke-dasharray: 8 16;
        animation: packetSpeed 2s linear infinite;
      }
      .anim-packet-slow {
        stroke-dasharray: 5 12;
        animation: packetSpeed 3.5s linear infinite;
      }
      .pulse-gold {
        animation: goldPulse 3.5s ease-in-out infinite;
      }
      .beacon-dot {
        animation: beaconBlink 1.5s ease-in-out infinite;
      }
      .mono-txt {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="270" rx="14" fill="url(#hermesBg)"/>
  <rect width="960" height="270" rx="14" fill="none" stroke="#232838" stroke-width="1.5"/>

  <!-- Celestial Constellation / Mesh Grid -->
  <g stroke="#181d2a" stroke-width="0.8" opacity="0.65">
    <line x1="50" y1="0" x2="50" y2="270"/>
    <line x1="140" y1="0" x2="140" y2="270"/>
    <line x1="230" y1="0" x2="230" y2="270"/>
    <line x1="320" y1="0" x2="320" y2="270"/>
    <line x1="410" y1="0" x2="410" y2="270"/>
    <line x1="500" y1="0" x2="500" y2="270"/>
    <line x1="590" y1="0" x2="590" y2="270"/>
    <line x1="680" y1="0" x2="680" y2="270"/>
    <line x1="770" y1="0" x2="770" y2="270"/>
    <line x1="860" y1="0" x2="860" y2="270"/>

    <line x1="0" y1="45" x2="960" y2="45"/>
    <line x1="0" y1="110" x2="960" y2="110"/>
    <line x1="0" y1="175" x2="960" y2="175"/>
    <line x1="0" y1="230" x2="960" y2="230"/>
  </g>

  <!-- Hermes Geometric Gold Reticles (Top & Bottom Corners) -->
  <g stroke="#FFAA00" stroke-width="1.5" opacity="0.85">
    <path d="M 18 32 L 18 18 L 32 18" fill="none"/>
    <path d="M 942 32 L 942 18 L 928 18" fill="none"/>
    <path d="M 18 238 L 18 252 L 32 252" fill="none"/>
    <path d="M 942 238 L 942 252 L 928 252" fill="none"/>
  </g>

  <!-- Top Metadata Status Bar -->
  <g class="mono-txt" font-size="10" letter-spacing="1.5">
    <text x="42" y="32" fill="#9DA9BA">NOUS RESEARCH // HERMES AGENT SPECIALIZED HARNESS</text>
    <circle cx="810" cy="28" r="4" fill="#FFD700" class="beacon-dot"/>
    <text x="822" y="32" fill="#FFD700" font-weight="700">HERMES FORENSICS ONLINE</text>
  </g>

  <!-- RIGHT: Hermes Cybernetic Caduceus & Constellation Network -->
  <g transform="translate(680, 50)">
    <!-- Network Links -->
    <line x1="50" y1="90" x2="140" y2="40" stroke="#262f44" stroke-width="1.5"/>
    <line x1="140" y1="40" x2="220" y2="80" stroke="#262f44" stroke-width="1.5"/>
    <line x1="50" y1="90" x2="130" y2="140" stroke="#262f44" stroke-width="1.5"/>
    <line x1="130" y1="140" x2="220" y2="80" stroke="#262f44" stroke-width="1.5"/>
    <line x1="140" y1="40" x2="130" y2="140" stroke="#262f44" stroke-width="1"/>

    <!-- Animated Packet Pulses -->
    <line x1="50" y1="90" x2="140" y2="40" stroke="#FF6B00" stroke-width="2" class="anim-packet-fast" filter="url(#goldGlow)"/>
    <line x1="140" y1="40" x2="220" y2="80" stroke="#00F0FF" stroke-width="2" class="anim-packet-fast" filter="url(#cyanGlow)"/>
    <line x1="130" y1="140" x2="220" y2="80" stroke="#FFD700" stroke-width="2" class="anim-packet-slow"/>

    <!-- Hermes Caduceus / Staff Centerpiece -->
    <g transform="translate(130, 20)">
      <!-- Winged Staff Shaft -->
      <line x1="0" y1="10" x2="0" y2="130" stroke="url(#caduceusGrad)" stroke-width="2.5" filter="url(#goldGlow)"/>
      <circle cx="0" cy="10" r="6" fill="#FFD700" filter="url(#goldGlow)"/>
      
      <!-- Caduceus Serpent Waves (stylized as circuit paths) -->
      <path d="M -16 55 Q 0 40 16 55 Q 0 70 -16 85 Q 0 100 16 115" fill="none" stroke="#FF8A00" stroke-width="1.8" opacity="0.8"/>
      <path d="M 16 55 Q 0 40 -16 55 Q 0 70 16 85 Q 0 100 -16 115" fill="none" stroke="#00F0FF" stroke-width="1.8" opacity="0.8"/>

      <!-- Stylized Hermes Wings at the top of the Caduceus -->
      <path d="M 0 15 C 10 5, 25 0, 36 10 C 26 14, 18 20, 0 25 Z" fill="#FFD700" opacity="0.9" filter="url(#goldGlow)"/>
      <path d="M 0 15 C -10 5, -25 0, -36 10 C -26 14, -18 20, 0 25 Z" fill="#FFD700" opacity="0.9" filter="url(#goldGlow)"/>
    </g>

    <!-- Constellation Nodes -->
    <circle cx="50" cy="90" r="9" fill="#0C1019" stroke="#FF6B00" stroke-width="2" filter="url(#goldGlow)"/>
    <circle cx="50" cy="90" r="3.5" fill="#FF8A00"/>
    <text x="50" y="112" fill="#8E9DAE" font-size="8.5" text-anchor="middle" class="mono-txt">INGRESS</text>

    <circle cx="140" cy="40" r="11" fill="#0C1019" stroke="#00F0FF" stroke-width="2" filter="url(#cyanGlow)"/>
    <circle cx="140" cy="40" r="4" fill="#00F0FF"/>
    <text x="140" y="24" fill="#00F0FF" font-size="8.5" text-anchor="middle" class="mono-txt">HERMES_DISSECT</text>

    <circle cx="220" cy="80" r="9" fill="#0C1019" stroke="#00E599" stroke-width="2"/>
    <circle cx="220" cy="80" r="3.5" fill="#00E599"/>
    <text x="220" y="102" fill="#8E9DAE" font-size="8.5" text-anchor="middle" class="mono-txt">EGRESS</text>

    <circle cx="130" cy="140" r="9" fill="#0C1019" stroke="#FF3366" stroke-width="2"/>
    <circle cx="130" cy="140" r="3.5" fill="#FF3366"/>
    <text x="130" y="162" fill="#FF6B8B" font-size="8.5" text-anchor="middle" class="mono-txt">ANOMALY</text>
  </g>

  <!-- LEFT: Hermes Winged Emblem & Typography -->
  <g transform="translate(42, 60)">
    <!-- Iconic Hermes Wing (Left) -->
    <path class="anim-wing-l" d="M 40 45 C 24 35, 2 32, -18 48 C -6 32, 14 18, 38 25 C 20 12, 4 10, -12 20 C 6 4, 28 -2, 48 8 C 36 -6, 20 -8, 2 -2 C 22 -14, 52 -12, 64 8 Z" fill="url(#hermesGold)" opacity="0.95" filter="url(#goldGlow)"/>
    
    <!-- Central Shield / Petasos Winged Crest -->
    <polygon points="50,15 76,28 76,64 50,78 24,64 24,28" fill="#111624" stroke="url(#hermesGold)" stroke-width="2.5" class="pulse-gold"/>
    <!-- Caduceus symbol inside shield -->
    <circle cx="50" cy="38" r="8" fill="none" stroke="#FFD700" stroke-width="1.8"/>
    <line x1="50" y1="28" x2="50" y2="68" stroke="#FFD700" stroke-width="2"/>
    <path d="M 44 48 Q 50 42 56 48 Q 50 54 44 60" fill="none" stroke="#FFAA00" stroke-width="1.6"/>

    <!-- Iconic Hermes Wing (Right) -->
    <path class="anim-wing-r" d="M 60 45 C 76 35, 98 32, 118 48 C 106 32, 86 18, 62 25 C 80 12, 96 10, 112 20 C 94 4, 72 -2, 52 8 C 64 -6, 80 -8, 98 -2 C 78 -14, 48 -12, 36 8 Z" fill="url(#hermesGold)" opacity="0.95" filter="url(#goldGlow)"/>
  </g>

  <!-- Project Name & Tagline -->
  <g transform="translate(180, 70)">
    <text x="0" y="34" fill="url(#hermesGold)" font-size="36" font-weight="900" letter-spacing="3" class="mono-txt pulse-gold">HERMES // NETSCOPE</text>
    <text x="2" y="58" fill="#E2E8F0" font-size="12" font-weight="700" letter-spacing="1.5" class="mono-txt">
      OFFLINE NETWORK CAPTURE INTELLIGENCE &amp; FORENSIC ENGINE
    </text>
    <text x="2" y="78" fill="#8A96A8" font-size="11.5" class="mono-txt">
      The swift wings of Hermes over every packet. Air-gapped pcap inspection, heuristics &amp; interactive replay.
    </text>
  </g>

  <!-- Bottom Badges / Metrics -->
  <g transform="translate(42, 198)">
    <!-- Badge 1: Hermes Core -->
    <rect x="0" y="0" width="160" height="30" rx="6" fill="#10141f" stroke="#252d42" stroke-width="1.2"/>
    <text x="12" y="19" fill="#FFD700" font-size="9.5" font-weight="800" class="mono-txt">HERMES ⚚ </text>
    <text x="68" y="19" fill="#E2E8F0" font-size="9.5" font-weight="600" class="mono-txt">NATIVE PLUGIN</text>

    <!-- Badge 2: Stdlib -->
    <rect x="172" y="0" width="155" height="30" rx="6" fill="#10141f" stroke="#252d42" stroke-width="1.2"/>
    <text x="184" y="19" fill="#FF7A00" font-size="9.5" font-weight="800" class="mono-txt">01 // </text>
    <text x="216" y="19" fill="#E2E8F0" font-size="9.5" font-weight="600" class="mono-txt">100% STDLIB</text>

    <!-- Badge 3: Air-Gapped -->
    <rect x="339" y="0" width="175" height="30" rx="6" fill="#10141f" stroke="#252d42" stroke-width="1.2"/>
    <text x="351" y="19" fill="#00F0FF" font-size="9.5" font-weight="800" class="mono-txt">02 // </text>
    <text x="383" y="19" fill="#E2E8F0" font-size="9.5" font-weight="600" class="mono-txt">ZERO TELEMETRY</text>

    <!-- Badge 4: Visual Replay -->
    <rect x="526" y="0" width="170" height="30" rx="6" fill="#10141f" stroke="#252d42" stroke-width="1.2"/>
    <text x="538" y="19" fill="#00E599" font-size="9.5" font-weight="800" class="mono-txt">03 // </text>
    <text x="570" y="19" fill="#E2E8F0" font-size="9.5" font-weight="600" class="mono-txt">TOPOLOGY REPLAY</text>
  </g>

  <!-- Speed Pulse Bottom Border -->
  <line x1="0" y1="268" x2="960" y2="268" stroke="url(#speedBeam)" stroke-width="2.5"/>
</svg>
