<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="auto">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080b"/>
      <stop offset="50%" stop-color="#0b0d13"/>
      <stop offset="100%" stop-color="#07080b"/>
    </linearGradient>

    <linearGradient id="nousOrangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="50%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FFAA00"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#7000FF"/>
    </linearGradient>

    <linearGradient id="pulseLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes packetFlow1 {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes packetFlow2 {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -200; }
      }
      @keyframes blinkGlow {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #00F0FF); }
        50% { opacity: 0.35; filter: drop-shadow(0 0 1px #00F0FF); }
      }
      @keyframes orangePulse {
        0%, 100% { opacity: 0.9; filter: drop-shadow(0 0 8px rgba(255,85,0,0.6)); }
        50% { opacity: 0.5; filter: drop-shadow(0 0 2px rgba(255,85,0,0.2)); }
      }
      @keyframes nodeFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      .packet-track {
        stroke-dasharray: 6 14;
        animation: packetFlow1 3s linear infinite;
      }
      .packet-track-rev {
        stroke-dasharray: 4 12;
        animation: packetFlow2 4s linear infinite;
      }
      .live-dot {
        animation: blinkGlow 2s ease-in-out infinite;
      }
      .title-glow {
        animation: orangePulse 3.5s ease-in-out infinite;
      }
      .float-node {
        animation: nodeFloat 4s ease-in-out infinite;
      }
      .tech-mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="260" rx="12" fill="url(#bgGrad)"/>
  <rect width="960" height="260" rx="12" fill="none" stroke="#1f2433" stroke-width="1.5"/>

  <!-- Subtle Cyberpunk Background Grid -->
  <g stroke="#161b26" stroke-width="0.8" opacity="0.65">
    <line x1="40" y1="0" x2="40" y2="260"/>
    <line x1="120" y1="0" x2="120" y2="260"/>
    <line x1="200" y1="0" x2="200" y2="260"/>
    <line x1="280" y1="0" x2="280" y2="260"/>
    <line x1="360" y1="0" x2="360" y2="260"/>
    <line x1="440" y1="0" x2="440" y2="260"/>
    <line x1="520" y1="0" x2="520" y2="260"/>
    <line x1="600" y1="0" x2="600" y2="260"/>
    <line x1="680" y1="0" x2="680" y2="260"/>
    <line x1="760" y1="0" x2="760" y2="260"/>
    <line x1="840" y1="0" x2="840" y2="260"/>
    <line x1="920" y1="0" x2="920" y2="260"/>

    <line x1="0" y1="40" x2="960" y2="40"/>
    <line x1="0" y1="100" x2="960" y2="100"/>
    <line x1="0" y1="160" x2="960" y2="160"/>
    <line x1="0" y1="220" x2="960" y2="220"/>
  </g>

  <!-- Corner Tech Reticles (Nous Research vibe) -->
  <g stroke="#FF5500" stroke-width="1.5" opacity="0.8">
    <path d="M 16 28 L 16 16 L 28 16" fill="none"/>
    <path d="M 944 28 L 944 16 L 932 16" fill="none"/>
    <path d="M 16 232 L 16 244 L 28 244" fill="none"/>
    <path d="M 944 232 L 944 244 L 932 244" fill="none"/>
  </g>

  <!-- Top System Bar -->
  <g class="tech-mono" font-size="10" letter-spacing="1.5" fill="#8E9AA8">
    <text x="36" y="32">NOUS RESEARCH // HERMES AGENT ECOSYSTEM</text>
    <circle cx="820" cy="28" r="4" fill="#00F0FF" class="live-dot"/>
    <text x="832" y="32" fill="#00F0FF" font-weight="600">AIR-GAPPED // ACTIVE</text>
  </g>

  <!-- Animated Background Network Vectors (Right Side) -->
  <g opacity="0.75" class="float-node">
    <!-- Links -->
    <line x1="670" y1="130" x2="770" y2="85" stroke="#222b3d" stroke-width="1.5"/>
    <line x1="770" y1="85" x2="880" y2="120" stroke="#222b3d" stroke-width="1.5"/>
    <line x1="670" y1="130" x2="750" y2="185" stroke="#222b3d" stroke-width="1.5"/>
    <line x1="750" y1="185" x2="880" y2="120" stroke="#222b3d" stroke-width="1.5"/>
    <line x1="770" y1="85" x2="750" y2="185" stroke="#222b3d" stroke-width="1"/>

    <!-- Animated Packet Pulses -->
    <line x1="670" y1="130" x2="770" y2="85" stroke="#FF5500" stroke-width="2" class="packet-track" filter="url(#glowOrange)"/>
    <line x1="770" y1="85" x2="880" y2="120" stroke="#00F0FF" stroke-width="2" class="packet-track-rev" filter="url(#glowCyan)"/>
    <line x1="750" y1="185" x2="880" y2="120" stroke="#00E599" stroke-width="2" class="packet-track"/>

    <!-- Network Nodes -->
    <!-- Node 1: Hub -->
    <circle cx="670" cy="130" r="14" fill="#0E121A" stroke="#FF5500" stroke-width="2" filter="url(#glowOrange)"/>
    <circle cx="670" cy="130" r="5" fill="#FF5500"/>
    <text x="670" y="156" fill="#8E9AA8" font-size="9" text-anchor="middle" class="tech-mono">192.168.1.1</text>

    <!-- Node 2: Client -->
    <circle cx="770" cy="85" r="9" fill="#0E121A" stroke="#00F0FF" stroke-width="1.8"/>
    <circle cx="770" cy="85" r="3.5" fill="#00F0FF"/>
    <text x="770" y="70" fill="#8E9AA8" font-size="8.5" text-anchor="middle" class="tech-mono">HOST:04</text>

    <!-- Node 3: Server -->
    <circle cx="880" cy="120" r="12" fill="#0E121A" stroke="#00E599" stroke-width="2"/>
    <circle cx="880" cy="120" r="4" fill="#00E599"/>
    <text x="880" y="145" fill="#8E9AA8" font-size="9" text-anchor="middle" class="tech-mono">GW:EGRESS</text>

    <!-- Node 4: Anomaly Target -->
    <circle cx="750" cy="185" r="8" fill="#0E121A" stroke="#FF3366" stroke-width="1.8"/>
    <circle cx="750" cy="185" r="3" fill="#FF3366"/>
    <text x="750" y="206" fill="#FF3366" font-size="8.5" text-anchor="middle" class="tech-mono">SCAN_TGT</text>
  </g>

  <!-- Left Main Identity Content -->
  <!-- Hex Icon -->
  <g transform="translate(42, 68)">
    <polygon points="26,4 50,18 50,46 26,60 2,46 2,18" fill="#140E0A" stroke="#FF5500" stroke-width="2.2" class="title-glow"/>
    <polygon points="26,14 40,22 40,38 26,46 12,38 12,22" fill="#FF5500" opacity="0.85"/>
    <circle cx="26" cy="30" r="3" fill="#FFF"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="110" y="102" fill="url(#nousOrangeGrad)" font-size="38" font-weight="800" letter-spacing="3" class="tech-mono title-glow">NETSCOPE</text>
  <text x="112" y="124" fill="#E2E8F0" font-size="12" font-weight="600" letter-spacing="1.2" class="tech-mono">
    OFFLINE NETWORK CAPTURE INTELLIGENCE &amp; INTERACTIVE DASHBOARD
  </text>
  <text x="112" y="145" fill="#717D96" font-size="11" class="tech-mono">
    Deep packet inspection, deterministic heuristics, topology graphing, and traffic replay for Hermes Agent.
  </text>

  <!-- Bottom Badges / Capabilities Matrix -->
  <g transform="translate(42, 185)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="138" height="28" rx="5" fill="#0f141d" stroke="#232d3f" stroke-width="1"/>
    <text x="12" y="18" fill="#FF7A00" font-size="9.5" font-weight="700" class="tech-mono">01 // </text>
    <text x="44" y="18" fill="#C5D1DE" font-size="9.5" font-weight="500" class="tech-mono">ZERO DEPS</text>

    <!-- Pill 2 -->
    <rect x="148" y="0" width="158" height="28" rx="5" fill="#0f141d" stroke="#232d3f" stroke-width="1"/>
    <text x="160" y="18" fill="#00F0FF" font-size="9.5" font-weight="700" class="tech-mono">02 // </text>
    <text x="192" y="18" fill="#C5D1DE" font-size="9.5" font-weight="500" class="tech-mono">NO TELEMETRY</text>

    <!-- Pill 3 -->
    <rect x="316" y="0" width="162" height="28" rx="5" fill="#0f141d" stroke="#232d3f" stroke-width="1"/>
    <text x="328" y="18" fill="#00E599" font-size="9.5" font-weight="700" class="tech-mono">03 // </text>
    <text x="360" y="18" fill="#C5D1DE" font-size="9.5" font-weight="500" class="tech-mono">TOPOLOGY REPLAY</text>

    <!-- Pill 4 -->
    <rect x="488" y="0" width="180" height="28" rx="5" fill="#0f141d" stroke="#232d3f" stroke-width="1"/>
    <text x="500" y="18" fill="#E57373" font-size="9.5" font-weight="700" class="tech-mono">04 // </text>
    <text x="532" y="18" fill="#C5D1DE" font-size="9.5" font-weight="500" class="tech-mono">HEURISTICS ENGINE</text>
  </g>

  <!-- Accent Bottom Border Line -->
  <line x1="0" y1="258" x2="960" y2="258" stroke="url(#pulseLineGrad)" stroke-width="2"/>
</svg>

