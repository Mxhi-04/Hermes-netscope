<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="100%" height="auto">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#0e1118"/>
    </linearGradient>
    <linearGradient id="pipeLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#00E599"/>
    </linearGradient>
    <style>
      @keyframes streamDot {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      .anim-stream {
        stroke-dasharray: 4 10;
        animation: streamDot 2s linear infinite;
      }
      .mono-pipe {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }
    </style>
  </defs>

  <rect width="960" height="170" rx="8" fill="url(#pipeBg)" stroke="#1F2432" stroke-width="1.2"/>

  <!-- Connecting Bus Line -->
  <line x1="80" y1="85" x2="880" y2="85" stroke="#252B3B" stroke-width="2"/>
  <line x1="80" y1="85" x2="880" y2="85" stroke="url(#pipeLine)" stroke-width="2" class="anim-stream"/>

  <!-- Stage 1: Stream Reader -->
  <g class="mono-pipe" transform="translate(40, 35)">
    <rect x="0" y="0" width="180" height="100" rx="6" fill="#141822" stroke="#2A3245" stroke-width="1.2"/>
    <rect x="0" y="0" width="180" height="4" rx="2" fill="#FF5500"/>
    <text x="14" y="24" fill="#FF7A00" font-size="9" font-weight="700">STAGE 01 // INGEST</text>
    <text x="14" y="44" fill="#E2E8F0" font-size="12" font-weight="600">Streaming Reader</text>
    <text x="14" y="64" fill="#8896A6" font-size="9.5">pcap &amp; pcapng formats</text>
    <text x="14" y="78" fill="#8896A6" font-size="9.5">SHB / IDB / EPB / SPB</text>
    <text x="14" y="92" fill="#8896A6" font-size="9.5">Stdlib binary struct unpack</text>
  </g>

  <!-- Stage 2: Protocol Decoder -->
  <g class="mono-pipe" transform="translate(265, 35)">
    <rect x="0" y="0" width="190" height="100" rx="6" fill="#141822" stroke="#2A3245" stroke-width="1.2"/>
    <rect x="0" y="0" width="190" height="4" rx="2" fill="#00F0FF"/>
    <text x="14" y="24" fill="#00F0FF" font-size="9" font-weight="700">STAGE 02 // DECODE</text>
    <text x="14" y="44" fill="#E2E8F0" font-size="12" font-weight="600">L2 – L7 Dissection</text>
    <text x="14" y="64" fill="#8896A6" font-size="9.5">Eth, 802.1Q, IPv4/v6, TCP/UDP</text>
    <text x="14" y="78" fill="#8896A6" font-size="9.5">DNS, TLS SNI, HTTP Host</text>
    <text x="14" y="92" fill="#8896A6" font-size="9.5">Zero payload retention</text>
  </g>

  <!-- Stage 3: Heuristics Engine -->
  <g class="mono-pipe" transform="translate(500, 35)">
    <rect x="0" y="0" width="195" height="100" rx="6" fill="#141822" stroke="#2A3245" stroke-width="1.2"/>
    <rect x="0" y="0" width="195" height="4" rx="2" fill="#FFB74D"/>
    <text x="14" y="24" fill="#FFB74D" font-size="9" font-weight="700">STAGE 03 // DETECT</text>
    <text x="14" y="44" fill="#E2E8F0" font-size="12" font-weight="600">Heuristics Engine</text>
    <text x="14" y="64" fill="#8896A6" font-size="9.5">Robust Z-Score (MAD)</text>
    <text x="14" y="78" fill="#8896A6" font-size="9.5">Periodic Beaconing (CV &lt; 0.2)</text>
    <text x="14" y="92" fill="#8896A6" font-size="9.5">Entropy &amp; Scan Heuristics</text>
  </g>

  <!-- Stage 4: Interactive Delivery -->
  <g class="mono-pipe" transform="translate(740, 35)">
    <rect x="0" y="0" width="180" height="100" rx="6" fill="#141822" stroke="#2A3245" stroke-width="1.2"/>
    <rect x="0" y="0" width="180" height="4" rx="2" fill="#00E599"/>
    <text x="14" y="24" fill="#00E599" font-size="9" font-weight="700">STAGE 04 // OUTPUT</text>
    <text x="14" y="44" fill="#E2E8F0" font-size="12" font-weight="600">Agent &amp; Dashboard</text>
    <text x="14" y="64" fill="#8896A6" font-size="9.5">Hermes Natural Language</text>
    <text x="14" y="78" fill="#8896A6" font-size="9.5">Force-Directed Topology</text>
    <text x="14" y="92" fill="#8896A6" font-size="9.5">Zero-CDN HTML Replay</text>
  </g>
</svg>

